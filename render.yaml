services:
  # ---------------------------------------------------------------------------
  # 1. Tap8583 Ingestion & WebSocket Backend Server (Kotlin / Ktor)
  # ---------------------------------------------------------------------------
  - type: web
    name: tap8583-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TAP8583_API_KEY
        value: tap_live_secret
      - key: HOST
        value: 0.0.0.0

  # ---------------------------------------------------------------------------
  # 2. Tap8583 Web Visualizer Dashboard (Next.js 15)
  # ---------------------------------------------------------------------------
  - type: web
    name: tap8583-web
    runtime: node
    rootDir: webApp
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_TAP8583_API_KEY
        value: tap_live_secret
