name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Test All Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'webApp/package.json'

      - name: Run Shared Kotlin JVM Tests
        run: ./gradlew :shared:jvmTest

      - name: Build Android Client Log Listener (listenerLib)
        run: ./gradlew :listenerLib:assemble

      - name: Build Ktor Ingestion Server (serverApp)
        run: ./gradlew :serverApp:assemble

      - name: Build Next.js Web Visualizer (webApp)
        run: |
          cd webApp
          npm install
          npm run build

      - name: Stage Release Artifacts
        run: |
          mkdir -p dist
          cp listenerLib/build/libs/*.jar dist/ || true
          cp serverApp/build/libs/*.jar dist/ || true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-build-${{ github.run_number }}
          name: Tap8583 v2.0.0 (Build ${{ github.run_number }})
          body: |
            ### Tap8583 Cloud Ingestion & Web Visualizer Release

            Automated release generated on commit `${{ github.sha }}`.

            #### 📦 Release Artifacts:
            * **`tap8583-listener` JAR**: Client library for Android / jPOS POS applications (also on Maven Central as `dev.sarari:tap8583-listener`).
            * **`serverApp`**: Kotlin / Ktor cloud ingestion server.
            * **`webApp`**: Next.js 15 Web application.

            #### 🚀 Quick Android Setup:
            ```kotlin
            VisualizerLogListener.install(apiKey = "YOUR_INGEST_KEY", endpoint = "https://your-host/api/v1/events")
            ```
          draft: false
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
