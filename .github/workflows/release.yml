name: Build and Release Installers

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read App Version
        id: app_version
        run: |
          VERSION=$(./gradlew -q :desktopApp:printVersion --no-configuration-cache)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Run JVM Tests
        run: ./gradlew :shared:jvmTest

      - name: Package Native Installer
        run: |
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            ./gradlew :desktopApp:packageDmg :desktopApp:packagePkg
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            ./gradlew :desktopApp:packageMsi :desktopApp:packageExe
          else
            ./gradlew :desktopApp:packageDeb
          fi
        shell: bash

      - name: Stage Distributables
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            cp desktopApp/build/compose/binaries/main/dmg/*.dmg dist/ || true
            cp desktopApp/build/compose/binaries/main/pkg/*.pkg dist/ || true
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp desktopApp/build/compose/binaries/main/msi/*.msi dist/ || true
            cp desktopApp/build/compose/binaries/main/exe/*.exe dist/ || true
          else
            cp desktopApp/build/compose/binaries/main/deb/*.deb dist/ || true
          fi
        shell: bash

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.VERSION }}-build-${{ github.run_number }}
          name: Release v${{ steps.app_version.outputs.VERSION }} (Build ${{ github.run_number }})
          body: |
            ### Automated Native Target Installer Release

            This release was automatically generated by GitHub Actions on merging changes to the `main` branch.

            * **App Version**: `${{ steps.app_version.outputs.VERSION }}`
            * **Build Number**: `${{ github.run_number }}`
            * **Commit**: `${{ github.sha }}`

            Download the appropriate installer below to test the **Tap8583** desktop app:
            * 🍏 **macOS**: `Tap8583-${{ steps.app_version.outputs.VERSION }}.dmg` / `Tap8583-${{ steps.app_version.outputs.VERSION }}.pkg`
            * 🪟 **Windows**: `Tap8583-${{ steps.app_version.outputs.VERSION }}.msi` / `Tap8583-${{ steps.app_version.outputs.VERSION }}.exe`
            * 🐧 **Linux**: `Tap8583-${{ steps.app_version.outputs.VERSION }}.deb`
          draft: false
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

